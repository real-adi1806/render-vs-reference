[project]
name = "pixel-truth"
version = "0.2.0"
description = "Measure a render against a reference image without lying to yourself."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adithya Krishnan" }]
keywords = ["visual-regression", "image-comparison", "design-qa", "screenshot-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/real-adi1806/render-vs-reference"
Issues = "https://github.com/real-adi1806/render-vs-reference/issues"

[project.scripts]
pixel-truth = "pixeltruth.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pixeltruth*"]
