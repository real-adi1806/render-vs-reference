[project]
name = "pixel-truth"
version = "0.1.0"
description = "Measure a render against a reference image without lying to yourself."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["visual-regression", "image-comparison", "design-qa", "screenshot-testing"]
dependencies = ["pillow>=9.0"]

[project.scripts]
pixel-truth = "pixeltruth.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pixeltruth*"]
